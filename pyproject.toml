[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figure-skating-bias"
version = "0.1.0"
description = "Reproducible analysis of judging patterns across figure skating disciplines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pymupdf>=1.24",
    "polars>=1.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
compat = ["pandas>=2.2"]
visualization = ["matplotlib>=3.8", "plotly>=5.20"]
notebooks = ["jupyterlab>=4"]
anomaly = ["scikit-learn>=1.4"]
bayesian = ["pymc>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
